<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>时代小卖部</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap">
<style>
/* 布局：站在柜台后面。左边是像素门市和柜台操作，右边是货架格子、玻璃柜和钱匣；手机上从上往下排。墙是上白下绿的供销社墙裙。 */
:root{
  --wall:#E7EAE3; --dado:#2E5A4B; --dado-deep:#21463A; --dado-edge:#16322A; --on-dado:#D6E3DC;
  --paper:#F5F4EE; --card:#FCFCF8; --news:#E3DFD3; --wood:#8A5A35; --wood-dark:#5E3A20;
  --ink:#1D2420; --ink-soft:#58645D; --rule:#AFC3D3;
  --seal:#B3312A; --seal-soft:#F3DCD7; --gain:#2D7A4C; --gain-soft:#DCEFE2;
  --font-brush:'Ma Shan Zheng','STKaiti','KaiTi',serif;
  --font-serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --font-hand:'Long Cang','STKaiti','KaiTi',cursive;
  --font-ui:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{background:var(--dado)}
body{margin:0;background:var(--dado);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
button:disabled{cursor:not-allowed}
kbd{font-family:var(--font-ui);font-size:11px;border:1px solid currentColor;border-radius:3px;padding:0 4px;opacity:.75}

.sign{background:var(--wall);border-bottom:6px solid var(--dado-edge)}
.sign-inner,.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sign-inner{padding-block:8px 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sign-inner > div:first-child{flex:none}
.sign-org{margin:0;font-size:11px;letter-spacing:.24em;color:var(--ink-soft)}
.sign-name{margin:0;font-family:var(--font-brush);font-weight:400;font-size:28px;line-height:1.05;color:var(--seal)}
.stat{flex:1;text-align:right;display:grid;gap:1px;min-width:0}
.stat-date{font-family:var(--font-serif);font-size:12px;color:var(--ink-soft)}
.stat-cash{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-cash.bump{animation:bump .5s ease}
.stat-meta{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;font-size:11px;color:var(--ink-soft)}
.stat-meta span{border:1px solid currentColor;border-radius:2px;padding:0 5px}
@keyframes bump{40%{transform:scale(1.12)}}

.wrap{padding-block:12px 96px}
.layout{display:grid;gap:12px;align-items:start}
.col{display:grid;gap:12px;min-width:0}
@media (min-width:900px){ .layout{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)} .side{position:sticky;top:12px} }

.scene-wrap{position:relative;border:3px solid var(--dado-edge);background:#000;box-shadow:0 10px 24px -14px rgba(0,0,0,.7)}
#scene{display:block;width:100%;height:auto;aspect-ratio:192/112;image-rendering:pixelated;image-rendering:crisp-edges}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;color:#FFF8D8;text-shadow:0 1px 0 #3a2a10,1px 0 0 #3a2a10,-1px 0 0 #3a2a10,0 -1px 0 #3a2a10;animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
.float.loss{color:#FFD2CC}
.float.note{font-size:12px;font-weight:700;color:#E9F6EE}
@keyframes floatUp{from{opacity:0;margin-top:6px}15%{opacity:1}to{opacity:0;margin-top:-26px}}
.scene-bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:8px;padding:3px 6px;font-size:11px;color:#F4F1E4;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
.speed{position:absolute;top:4px;right:4px;font-size:11px;padding:2px 7px;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.35);color:#F4F1E4;border-radius:3px}
.bubble{position:absolute;left:50%;top:6%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:#FFFEF8;border:2px solid var(--ink);padding:3px 7px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.bubble img{width:20px;height:20px;image-rendering:pixelated}

.paper{background:var(--paper);padding:14px;box-shadow:0 2px 0 var(--dado-edge),0 14px 30px -18px rgba(0,0,0,.6);display:grid;gap:10px;min-width:0}
.panel-title{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;letter-spacing:.18em;color:var(--ink-soft)}
.panel-title b{font-family:var(--font-brush);font-weight:400;font-size:20px;letter-spacing:.05em;color:var(--ink)}
.eyebrow{margin:0;font-size:12px;letter-spacing:.2em;color:var(--ink-soft)}
.brush-xl{margin:0;font-family:var(--font-brush);font-weight:400;font-size:46px;line-height:1.05;color:var(--seal)}
.prose{margin:0;font-family:var(--font-serif);font-size:16px;line-height:1.85}
.hint{margin:0;font-size:13px;color:var(--ink-soft)}
.primary{border:0;background:var(--seal);color:#FFF8F4;padding:12px 16px;font-size:16px;font-weight:700;border-radius:3px;width:100%;letter-spacing:.06em}
.primary:disabled{opacity:.45}
.btn{border:1px solid var(--ink);background:var(--card);padding:8px 12px;border-radius:3px;font-weight:600}
.btn:hover:not(:disabled){background:var(--seal-soft)}
.btn:disabled{opacity:.4}
.btn.go{background:var(--gain);border-color:var(--gain);color:#F2FBF5}
.btn.go:hover:not(:disabled){background:#256a41}
.btn.no{background:var(--card);border-color:var(--seal);color:var(--seal)}
.btn.small{padding:4px 9px;font-size:13px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 auto}

/* 客人 */
.who{display:flex;gap:12px;align-items:center}
.seal{flex:none;width:42px;height:42px;border:2px solid var(--seal);color:var(--seal);font-family:var(--font-brush);font-size:25px;line-height:38px;text-align:center;transform:rotate(-3deg);background:var(--card)}
.seal.plain{border-color:var(--ink-soft);color:var(--ink-soft)}
.who b{display:block;font-size:16px}
.who small{display:block;color:var(--ink-soft);font-size:12px}
.speech{margin:0;font-family:var(--font-serif);font-size:16px;line-height:1.8}
.chat{margin:0;font-family:var(--font-serif);font-size:14px;line-height:1.7;color:var(--ink-soft);border-left:2px solid var(--rule);padding-left:10px}
.msg{margin:0;padding:6px 10px;border-left:3px solid var(--seal);background:var(--seal-soft);font-size:14px;font-family:var(--font-serif)}
.msg.ok{border-left-color:var(--gain);background:var(--gain-soft)}
.choices{display:grid;gap:8px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:10px 12px;background:var(--card);border:1px solid var(--ink);border-radius:3px;min-height:44px}
.choice:hover:not(:disabled){background:var(--seal-soft)}
.choice:disabled{opacity:.45}
.choice-main{display:flex;gap:10px;align-items:center;min-width:0}
.key{flex:none;width:20px;height:20px;border:1px solid var(--ink-soft);border-radius:3px;font-size:11px;line-height:18px;text-align:center;color:var(--ink-soft)}
.choice-text{display:grid;min-width:0}
.choice-sub{font-size:12px;color:var(--ink-soft)}
.choice-price{flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:var(--seal)}
.result{display:grid;gap:10px;animation:rise .25s ease}
.result-text{margin:0;font-family:var(--font-serif);font-size:16px;line-height:1.8;color:var(--ink-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 8px;border:1px solid var(--ink-soft);color:var(--ink-soft);border-radius:2px;font-variant-numeric:tabular-nums}
.chip.up{border-color:var(--gain);color:var(--gain)}
.chip.down{border-color:var(--seal);color:var(--seal)}
.next{border:1px solid var(--dado);background:var(--dado);color:var(--on-dado);padding:10px 14px;border-radius:3px;font-weight:700;letter-spacing:.06em}
@keyframes rise{from{opacity:.4;transform:translateY(4px)}}

/* 柜台 */
.slip{display:grid;gap:6px;background:#FFFDF4;border:1px dashed var(--ink-soft);padding:8px 10px}
.slip-row{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.slip-row img{width:24px;height:24px;image-rendering:pixelated}
.slip-row .need{flex:1;min-width:0}
.slip-row .got{font-size:13px;color:var(--ink-soft)}
.slip-row.done .got{color:var(--gain);font-weight:700}
.slip-row.over .got{color:#b07a1a;font-weight:700}
.counter{background:linear-gradient(var(--wood) 0 6px,#a8744a 6px);padding:10px;border-radius:3px;display:grid;gap:8px;color:#FFF8EC}
.counter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:34px}
.counter .btn{color:var(--ink)}
.counter .btn.no{color:var(--seal)}
.counter-label{font-size:12px;letter-spacing:.12em;opacity:.85;min-width:4.5em}
.thing{display:inline-flex;align-items:center;gap:4px;background:#FFFEF8;color:var(--ink);border:1px solid var(--wood-dark);padding:2px 6px 2px 3px;border-radius:2px;font-size:13px;font-variant-numeric:tabular-nums}
.thing img{width:22px;height:22px;image-rendering:pixelated}
button.thing:hover{background:var(--seal-soft)}
.ticket{display:inline-grid;gap:0;background:#F8EFD8;border:1.5px solid #9a6a3a;color:#5a3a1a;padding:3px 8px;font-family:var(--font-serif);font-size:12px;line-height:1.35;text-align:left}
.ticket b{color:var(--seal)}
.tool{background:var(--card);border:1px solid var(--ink-soft);padding:10px;display:grid;gap:8px;color:var(--ink)}
.gauge{position:relative;height:18px;background:#E9E6DA;border:1px solid var(--ink-soft)}
.gauge-fill{position:absolute;left:0;top:0;bottom:0;background:#C9905A}
.gauge-fill.liq{background:#5a3420}
.gauge-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--seal)}
.gauge-txt{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.abacus{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#3a2a1a;color:#F4E6C8;padding:8px 10px;border-radius:3px}
.abacus .sum{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;min-width:5.5em}
.abacus .list{font-size:12px;opacity:.8;flex:1 1 100%}
.abacus .btn{background:#5a4028;border-color:#7a5a3a;color:#F4E6C8;padding:4px 8px;font-size:13px}
.abacus .btn:hover:not(:disabled){background:#6a4a30}

/* 右侧：货架格子、玻璃柜、钱匣 */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cell{position:relative;display:grid;justify-items:center;gap:1px;padding:6px 2px 5px;background:var(--card);border:1px solid #c9c4b4;border-radius:2px;min-width:0}
.cell img{width:32px;height:32px;image-rendering:pixelated}
.cell .nm{font-family:var(--font-brush);font-size:15px;line-height:1.1;white-space:nowrap}
.cell .pr{font-size:11px;color:var(--seal);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .st{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell.low .st{color:var(--seal);font-weight:700}
.cell.want{border-color:var(--gain);box-shadow:0 0 0 2px var(--gain) inset}
.cell.sel{border-color:var(--seal);box-shadow:0 0 0 2px var(--seal) inset}
.cell:disabled{opacity:.55}
button.cell:hover:not(:disabled){background:var(--seal-soft)}
.cell .badge{position:absolute;top:2px;right:3px;font-family:var(--font-brush);font-size:12px;color:var(--seal)}
.case{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:#B9D9D4;border:3px solid var(--wood-dark);padding:6px}
.slot{display:grid;justify-items:center;align-content:center;min-height:62px;background:rgba(255,255,255,.45);border:1px dashed #6f9590;font-size:12px;color:var(--ink-soft)}
.slot img{width:32px;height:32px;image-rendering:pixelated}
.slot.sel{border:2px solid var(--seal);background:rgba(255,240,236,.8)}
.till{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.coin{display:grid;justify-items:center;gap:0;padding:4px 2px;background:#3a2a1a;color:#F4E6C8;border:1px solid #1e140a;border-radius:2px;font-size:12px;font-variant-numeric:tabular-nums;min-width:0}
.coin img{width:28px;height:28px;image-rendering:pixelated}
.coin:disabled{opacity:.45}
button.coin:hover:not(:disabled){background:#4a3622}
.notice-card{background:#FBF6E6;border:1px solid #9a8a6a;padding:8px 10px;font-family:var(--font-serif);font-size:13px;line-height:1.7}
.notice-card b{color:var(--seal)}

.newspaper{background:var(--news)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:3px double var(--ink);padding-bottom:6px;flex-wrap:wrap}
.mast-name{font-family:var(--font-brush);font-size:34px;line-height:1}
.mast-date{font-family:var(--font-serif);font-size:12px;color:var(--ink-soft)}
.headline{margin:0;font-family:var(--font-serif);font-weight:700;font-size:20px;line-height:1.45}
.news-body{margin:0;font-family:var(--font-serif);font-size:15px;line-height:1.8;text-indent:2em}
.news-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.weather{border:1px solid var(--ink);padding:2px 10px;font-family:var(--font-serif);font-size:13px}
.brief{font-family:var(--font-serif);font-size:13px;color:var(--ink-soft)}
.receipt{font-family:var(--font-hand);font-size:20px;line-height:1.5}

.rows{list-style:none;margin:0;padding:0;display:grid}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
.row img{width:24px;height:24px;image-rendering:pixelated}
.row-name{font-weight:700}
.row-sub{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border:1px solid var(--ink);background:var(--card);border-radius:3px;font-size:18px;line-height:1}
.step button:disabled{opacity:.35}
.step output{min-width:2ch;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:14px}
.oil{display:flex;gap:4px}
.oil i{width:14px;height:20px;border-radius:7px 7px 3px 3px;background:#F2C14E;box-shadow:0 0 8px #F2C14E}
.oil i.off{background:#5a5a50;box-shadow:none}
.acts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.act{display:grid;gap:2px;text-align:left;padding:8px 10px;background:var(--card);border:1px solid var(--ink);border-radius:3px}
.act small{color:var(--ink-soft);font-size:12px}
.act:disabled{opacity:.4}
.act.done{border-color:var(--gain);background:var(--gain-soft)}

.ledger-page{background:repeating-linear-gradient(var(--paper) 0 31px,var(--rule) 31px 32px);background-position:0 6px}
.ledger-page h2,.sheet h2{margin:0;font-family:var(--font-brush);font-weight:400;font-size:28px}
.sum{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:16px;font-variant-numeric:tabular-nums}
.sum dt{color:var(--ink-soft);line-height:32px}
.sum dd{margin:0;text-align:right;line-height:32px;font-family:var(--font-hand);font-size:22px;min-width:0}
.sum dd.small{font-family:var(--font-ui);font-size:13px;line-height:1.5;padding-block:7px}
.diary{margin:0;font-family:var(--font-hand);font-size:23px;line-height:32px;color:var(--dado-deep)}
.echo{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.echo li{font-family:var(--font-serif);font-size:15px;line-height:1.8;padding-left:14px;border-left:2px solid var(--seal)}
.echo.history li{border-left-color:var(--rule);color:var(--ink-soft);font-size:14px}
.echo b{font-family:var(--font-ui)}

.ledger-btn{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--paper);border:2px solid var(--ink);font-family:var(--font-brush);font-size:22px;padding:6px 14px;box-shadow:0 6px 16px -6px rgba(0,0,0,.6);border-radius:3px}
.ledger-btn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--seal);vertical-align:top;margin-left:2px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,22,17,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{width:100%;max-width:560px;max-height:84%;overflow:auto;background:repeating-linear-gradient(var(--paper) 0 31px,var(--rule) 31px 32px);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.sheet.center{align-items:center}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet h3{margin:0;font-size:12px;letter-spacing:.2em;color:var(--ink-soft);font-weight:400}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;justify-content:space-between;gap:12px;line-height:32px;font-family:var(--font-hand);font-size:22px}
.lines .meta{font-family:var(--font-ui);font-size:12px;color:var(--ink-soft)}
.empty{font-size:13px;color:var(--ink-soft);margin:0;line-height:32px}
.bigticket{background:#F8EFD8;border:3px double #9a6a3a;padding:16px;font-family:var(--font-serif);color:#4a2a10;display:grid;gap:6px;max-width:340px;margin:0 auto}
.bigticket .t{font-family:var(--font-brush);font-size:26px;color:var(--seal);text-align:center}
.bigticket .smudge{background:linear-gradient(90deg,transparent,rgba(90,60,30,.35),transparent);padding:0 4px}

@media (min-width:900px){.sign-name{font-size:34px}.brush-xl{font-size:58px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<header class="sign">
  <div class="sign-inner">
    <div><p class="sign-org">青石镇供销社</p><h1 class="sign-name">第七门市部</h1></div>
    <div class="stat" aria-live="polite">
      <span class="stat-date" id="statDate"></span>
      <span class="stat-cash" id="statCash"></span>
      <span class="stat-meta" id="statMeta"></span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="layout">
    <div class="col">
      <div class="scene-wrap">
        <canvas id="scene" width="192" height="112" role="img" aria-label="像素画：从柜台里往外看，镇口门市部和门外的街"></canvas>
        <div class="fx" id="fx" aria-hidden="true"></div>
        <div id="bubble"></div>
        <div class="scene-bar" id="sceneBar" aria-hidden="true"></div>
        <button class="speed" id="speedBtn" type="button" title="动画快慢（键盘 F）">慢放</button>
      </div>
      <section id="stage" aria-live="polite"></section>
    </div>
    <aside class="col side" id="side"></aside>
  </div>
</main>

<button class="ledger-btn" id="ledgerBtn" type="button" aria-haspopup="dialog">账本</button>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="账本"><div class="sheet-panel" id="sheetPanel"></div></div>
<div class="sheet center" id="modal" hidden role="dialog" aria-modal="true" aria-label="细看"><div class="sheet-panel" id="modalPanel"></div></div>

<script>

// ===================== 钱：按面额放在钱匣里 =====================
const fmt = f => (f<0?'−':'') + '¥' + (Math.abs(f)/100).toFixed(2);
const yuan = f => (f/100).toFixed(2) + ' 元';
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[rnd(0,arr.length-1)];
const pickW = items => { const t=items.reduce((s,[,w])=>s+w,0); let r=Math.random()*t; for (const [v,w] of items){ if((r-=w)<0) return v; } return items[0][0]; };
const sum = o => Object.values(o).reduce((s,v)=>s+v,0);
const sumDen = m => DEN.reduce((s,d)=>s+d*(m[d]||0),0);
function cash(){ return sumDen(S.till); }
// 把一笔钱拆成零钱放进钱匣：大钱为主，夹些分币
function breakdown(amt){
  const out={}; let r=amt;
  for (const d of [...DEN].reverse()){ if (d>r) continue; let n=Math.floor(r/d); if (d>=100 && n>0 && Math.random()<0.4) n=Math.max(0,n-1); if (n){ out[d]=n; r-=n*d; } }
  if (r>0){ for (const d of [...DEN].reverse()){ while (r>=d){ out[d]=(out[d]||0)+1; r-=d; } } }
  return out;
}
function gain(amt){ if (amt<=0) return; const b=breakdown(amt); for (const d in b) S.till[d]=(S.till[d]||0)+b[d]; }
// 付出去：先用大的；凑不齐就多给一张，对方找回零钱
function spend(amt){
  if (amt<=0) return true; if (cash()<amt) return false;
  let r=amt;
  for (const d of [...DEN].reverse()){ while (r>=d && S.till[d]>0){ S.till[d]--; r-=d; } }
  if (r>0){ const d=DEN.find(x=>x>=r && S.till[x]>0) || DEN.find(x=>S.till[x]>0); S.till[d]--; gain(d-r); }
  return true;
}
function makeChange(due, from){
  const m={}; let r=due;
  for (const d of [...DEN].reverse()){ let have=from[d]||0; while (r>=d && have>0){ m[d]=(m[d]||0)+1; have--; r-=d; } }
  return r===0 ? m : null;
}
// 客人掏钱：三成正好，其余掏一张够数的票子
function customerPays(total){
  if (Math.random()<0.3){ const m={}; let r=total; for (const d of [...DEN].reverse()){ while (r>=d){ m[d]=(m[d]||0)+1; r-=d; } } return m; }
  const d = [10,20,50,100,200,500,1000].find(x=>x>=total) || 1000;
  const m={[d]:1}; if (d<total){ const extra=customerPays(total-d); for (const k in extra) m[k]=(m[k]||0)+extra[k]; }
  return m;
}

// ===================== 货 =====================
const isBulk = g => GOODS[g].kind!=='count';
function amtText(g,u){
  if (!isBulk(g)) return `${u}${GOODS[g].u}`;
  const jin=Math.floor(u/100), rest=u%100, liang=Math.floor(rest/10), qian=rest%10;
  let s=''; if (jin) s+=`${jin}斤`; if (liang||qian) s+= qian ? `${liang}.${qian}两` : `${liang}两`; if (!s) s='0两';
  if (u===50) s='半斤'; if (u===150) s='1斤半';
  return s;
}
function stockText(g,u){ return isBulk(g) ? (Math.round(u/10)/10)+'斤' : `${u}${GOODS[g].u}`; }
function priceOf(g,u,unit){ const P = unit ?? GOODS[g].P; return isBulk(g) ? Math.round(P*u/100) : P*u; }
function unitLabel(g){ return isBulk(g) ? '斤' : GOODS[g].u; }

// ===================== 小工具 =====================
function rel(id,d){ S.rel[id]=(S.rel[id]||0)+d; }
function meet(id){ if(!S.met.includes(id)) S.met.push(id); }
function repWord(r){ return r<25?'名声坏了':r<40?'有人说闲话':r<60?'口碑一般':r<75?'口碑不错':'金字招牌'; }
function relWord(v){ return v<=-3?'结了梁子':v<0?'生分了':v===0?'点头之交':v<=2?'熟络':v<=4?'交心':'过命的交情'; }
function sell(g,u,amount){ S.stock[g]-=u; gain(amount); S.stats.rev+=amount; }
function sellFake(n,amount){ S.fake-=n; gain(amount); S.stats.rev+=amount; S.fakeSoldToday+=n; S.flags.soldFake=1; }
function credit(id,amt){ S.debts[id]=(S.debts[id]||0)+amt; S.stats.credit+=amt; }
function collect(id){ const a=S.debts[id]||0; gain(a); S.stats.back+=a; delete S.debts[id]; return a; }
function owe(id,amt){ S.owe[id]=(S.owe[id]||0)+amt; }
function fine(amt){ const paid=Math.min(amt,cash()); spend(paid); if (paid<amt){ owe('zhao',amt-paid); S.rep-=2; } return paid; }

  rent:{ who:'chen',
    text:()=>{ const bad=S.tickets.bad.length, short=RENT+bad*20-cash();
      return '天快黑了，晒谷场那边已经有人在摆板凳。陈主任背着手进来：“礼拜五了，八块钱。这礼拜收的糖票也交给我。”'
        + (S.tickets.good+bad ? `他把糖票一张张翻过去${bad?`，挑出 ${bad} 张：“${badTicketWords()}，这几张供销社不认，按议价差价补钱。”`:'，点了点头。'}` : '')
        + (short>0?`你拉开钱匣子，数了两遍，还差 ${yuan(short)}。`:''); },
    choices:()=>{
      const bad=S.tickets.bad.length*20, short=RENT+bad-cash(); const out=[];
      const fineNote = bad ? `，另补糖票差价 ${yuan(bad)}` : '';
      if (short<=0) return [{label:`交八块${bad?'，补差价':''}`, price:-(RENT+bad), fx:()=>{ spend(RENT+bad); S.flags.paidRent=1; if (bad) rel('chen',-1); return bad ? '他把钱和挑出来的糖票一起收走：“下礼拜看清楚再收。”' : '他把钱数了一遍，在收据上签了字：“头一个礼拜，干得不错。”'; }}];
      if ((S.rel.wang||0)>=2) out.push({label:'去隔壁找王婶借', sub:`借 ${yuan(short)}${fineNote}`, fx:()=>{ owe('wang',short); gain(short); spend(RENT+bad); S.flags.paidRent=1; S.flags.borrowWang=1; return `王婶从床头的铁皮盒里数出${yuan(short)}：“啥时候有啥时候还。”你把钱交给陈主任，他在收据上签了字。`; }});
      if ((S.rel.liu||0)>=1) out.push({label:'找刘哥周转', sub:`借 ${yuan(short)}，下礼拜多还一块`, fx:()=>{ owe('liu',short+100); gain(short); spend(RENT+bad); S.flags.paidRent=1; S.flags.borrowLiu=1; return '刘哥从裤兜里抽出几张票子：“下礼拜还我，多给一块就行。兄弟之间，好说。”'; }});
      out.push({label:'陈主任，能不能宽限几天', sub:'先交手上有的', fx:()=>{ owe('chen',short); spend(cash()); S.rep-=3; S.flags.rentLate=1; return '“就这一回。”他在本子上记了一笔，“镇上人可都看着呢。”'; }});
      return out;
    }},
};
function buyFake(n,cost){ spend(cost); S.stats.spent+=cost; S.fake+=n; rel('liu',2); S.flags.boughtFake=1; return '他把两条烟塞到你柜台底下，拍拍你的肩：“以后有好东西，先想着你。”'; }
function badTicketWords(){ const t=S.tickets.bad; const w=[]; if (t.includes('month')) w.push('过期的'); if (t.includes('county')) w.push('外县的'); if (t.includes('altered')) w.push('涂改过的'); return w.join('、')||'不对的'; }

// ===================== 普通客人 =====================
function genWalker(d){
  const disp = S.display.filter(Boolean);
  const g = pickW(ORDER.map(g=>[g, GOODS[g].w*(d.mult[g]||1)*(disp.includes(g)?1.6:1)]));
  let wi = rnd(0,WALKERS.length-1);
  if ((g==='cig'||g==='liquor') && WALKERS[wi].kid) wi = 4;
  const items=[{g, amt:pick(GOODS[g].req)}];
  if (Math.random()<0.3){ const g2=pick(ORDER.filter(x=>x!==g && x!=='cig' && x!=='liquor' && x!=='sugar')); items.push({g:g2, amt:pick(GOODS[g2].req)}); }
  const w={items, wi};
  if (items.some(i=>i.g==='sugar')){
    w.ticket = Math.random() < (d.sugarShort?0.45:0.6);
    if (w.ticket){ const bad = S.flags.ticketRule && Math.random()<0.35; w.tk = bad ? pick(['month','county','altered']) : null;
      w.tkMonth = w.tk==='month' ? pick([5,6]) : 7; w.tkCounty = w.tk==='county' ? pick(COUNTIES) : '青石县'; }
  }
  if (Math.random()<0.35) w.chat = rnd(0,CHAT.length-1);
  return w;
}
function walkText(w){
  const parts = w.items.map(({g,amt})=>{
    const a=amtText(g,amt);
    return ({soy:`打${a}酱油`, oil:`打${a}煤油`, liquor:`打${a}散酒`, salt:`称${a}盐`, sugar:`称${a}白糖`, peanut:`称${a}花生米`,
      match:`拿${a}火柴`, cig:`来${a}大前门`, soda:`拿${a}汽水`, ice:`来${a}冰棍`, candy:`称${a}水果糖`, soap:`拿${a}肥皂`})[g];
  });
  let s = '“'+parts.join('，再')+'。”';
  if (w.ticket) s += '递过来一张糖票。';
  if (w.items.some(i=>i.g==='sugar') && !w.ticket) s += '“没有糖票，议价的也行。”';
  return s;
}

// ===================== 柜台上的一笔买卖 =====================
function makeTx(w){
  const tx = {req:w.items.map(i=>({g:i.g, amt:i.amt})), give:{}, tool:null, step:'prep', adj:0, pay:null, change:{}, candy:0, msg:null, msgOk:false, protested:0, complained:0};
  if (w.ticket) tx.ticketState='pending';
  return tx;
}
function txUnitPrice(g){ if (g!=='sugar') return GOODS.sugar && GOODS[g].P; const tx=S.tx, w=curWalker();
  if (w && w.ticket && tx.ticketState==='ok') return GOODS.sugar.P;
  return DAYS[S.day].sugarShort ? 120 : GOODS.sugar.yi; }
function listTotal(){ return S.tx.req.reduce((s,r)=>s+priceOf(r.g, r.amt, txUnitPrice(r.g)),0); }
function quote(){ return Math.max(0, listTotal()+S.tx.adj); }
function curItem(){ return S.queue[S.qi]; }
function curWalker(){ const it=curItem(); return it && it.k==='walk' ? it.w : null; }
function walkerInfo(){ return WALKERS[curWalker().wi]; }
function giveOf(g){ return S.tx.give[g]||0; }
function reqOf(g){ const r=S.tx.req.find(x=>x.g===g); return r?r.amt:0; }
function avail(g){ return S.stock[g]-giveOf(g); }
function allOnCounter(){ return S.tx.req.every(r => isBulk(r.g) ? giveOf(r.g)>0 : giveOf(r.g)>=r.amt); }
function needsTicketDecision(){ return S.tx.ticketState==='pending'; }

function tapGood(g){
  const tx=S.tx; if (!tx || tx.step!=='prep') return;
  if (!reqOf(g)){ tx.msg=`客人没要${GOODS[g].n}。`; tx.msgOk=false; return render(); }
  if (isBulk(g)){ tx.tool=g; return render(); }
  if (giveOf(g)>=reqOf(g)){ tx.msg=`${GOODS[g].n}已经够数了。`; tx.msgOk=false; return render(); }
  if (avail(g)<1){ tx.msg=`${GOODS[g].n}卖完了。`; tx.msgOk=false; return render(); }
  tx.give[g]=giveOf(g)+1; tx.msg=null; Scene.pop(g); render();
}
function takeBack(g){ const tx=S.tx; if (!tx||tx.step!=='prep') return; if (isBulk(g)){ tx.tool=g; return render(); } if (giveOf(g)>0) tx.give[g]--; render(); }
function measure(g, how){
  const tx=S.tx; if (!tx||tx.step!=='prep') return;
  let d=0;
  if (how==='ladle') d=GOODS[g].ladle; else if (how==='unladle') d=-GOODS[g].ladle;
  else if (how==='scoop') d=rnd(6,14); else if (how==='pinch') d=2; else if (how==='back') d=-3;
  else if (how==='packet'){ if (S.packets<1) return; d=50; S.packets--; tx.usedPackets=(tx.usedPackets||0)+1; }
  const cur=giveOf(g);
  d = Math.max(-cur, Math.min(d, avail(g)));
  if (!d){ tx.msg = how==='back'||how==='unladle' ? '已经倒空了。' : `${GOODS[g].n}不够了。`; tx.msgOk=false; return render(); }
  tx.give[g]=cur+d; tx.msg=null; if (d>0) Scene.pop(g); render();
}
function setAdj(delta){ const tx=S.tx; if (!tx||tx.step!=='prep') return; tx.adj=Math.max(-listTotal(), tx.adj+delta); render(); }
function ticketDecide(ok){ const tx=S.tx; tx.ticketState = ok ? 'ok' : 'refused'; if (!ok){
    const w=curWalker(), W0=walkerInfo();
    if (!w.tk){ S.rep-=1; tx.msg=`“这票哪儿不对了？”${W0.p}不太高兴，还是答应按议价买。`; } else { tx.msg=`${W0.p}讪讪地把票收了回去：“那……按议价吧。”`; }
    if (Math.random()<0.3 && !w.tk){ return walkAway('“议价太贵，不买了。”'+W0.p+'把糖票揣回兜里走了。'); }
  } else tx.msg=null; tx.msgOk=ok; render(); }

function walkAway(text){ const before=snap(); S.rep=Math.max(0,S.rep); returnChange(); S.res={text, chips:diff(before)}; S.tx.step='done'; Scene.react(before,'walk'); render(); }

// 「收钱」：报价、分量都过一遍客人的眼
function collectPay(){
  const tx=S.tx, w=curWalker(), W0=walkerInfo(); if (!tx||tx.step!=='prep') return;
  if (!allOnCounter()){ tx.msg='东西还没备齐。'; tx.msgOk=false; return render(); }
  if (needsTicketDecision()){ tx.msg='先看看糖票，收还是不收。'; tx.msgOk=false; return render(); }
  // 分量
  for (const r of tx.req){ if (!isBulk(r.g)) continue; const short=r.amt-giveOf(r.g);
    if (short>3 && !tx.complained && Math.random()<W0.savvy){ tx.complained=1; S.rep-=1; tx.msg=`${W0.p}盯着秤看了一眼：“${GOODS[r.g].n}分量不够啊，差着${amtText(r.g,short)}呢。”`; tx.msgOk=false; return render(); } }
  // 价钱
  const L=listTotal(), Q=quote();
  if (Q>L){ const r=(Q-L)/Math.max(1,L); const p=Math.max(0.05, 1-W0.savvy*0.8-r*1.2);
    if (Math.random()>p){ tx.protested++; S.rep-=1; tx.adj=0;
      if (tx.protested>=2 || r>0.5) return walkAway(`“牌价才${fmt(L)}，你这儿抢钱啊？”${W0.p}转身走了。`);
      tx.msg=`“墙上牌价写着${fmt(L)}，你怎么要${fmt(Q)}？”算盘只好拨回牌价。`; tx.msgOk=false; return render(); } }
  tx.pay = customerPays(Q); tx.step='change'; tx.msg=null; render();
}
function changeDue(){ return sumDen(S.tx.pay) - quote(); }
function changeGiven(){ return sumDen(S.tx.change) + S.tx.candy; }
function addChange(d){ const tx=S.tx; if (!tx||tx.step!=='change'||!(S.till[d]>0)) return; S.till[d]--; tx.change[d]=(tx.change[d]||0)+1; render(); }
function removeChange(d){ const tx=S.tx; if (!tx||!(tx.change[d]>0)) return; tx.change[d]--; S.till[d]++; render(); }
function returnChange(){ const tx=S.tx; if (!tx) return; for (const d in tx.change){ S.till[d]+=tx.change[d]; } tx.change={}; tx.candy=0; }
function autoChange(){ const tx=S.tx; if (!tx||tx.step!=='change') return; returnChange();
  const due=changeDue(); const pool={...S.till}; for (const d in tx.pay) pool[d]=(pool[d]||0)+tx.pay[d];
  let m=makeChange(due,S.till);
  if (!m){ tx.msg='钱匣里零钱不够，凑不出正好的数。可以拿水果糖抵几分钱。'; tx.msgOk=false; return render(); }
  for (const d in m){ S.till[d]-=m[d]; tx.change[d]=m[d]; } tx.msg=null; render(); }
function candyChange(){ const tx=S.tx; if (!tx||tx.step!=='change') return; const left=changeDue()-changeGiven(); if (left<=0||left>4) return; if (S.stock.candy<left) return; tx.candy+=left; render(); }

function finishDeal(){
  const tx=S.tx, w=curWalker(), W0=walkerInfo(); if (!tx||tx.step!=='change') return;
  const due=changeDue(), given=changeGiven();
  if (tx.candy && !W0.kid && Math.random()<0.15){ tx.candy=0; tx.msg=`“我不要糖，找钱。”${W0.p}把糖推了回来。`; tx.msgOk=false; return render(); }
  if (given<due){ const diff=due-given; if (!tx.shortNoticed && Math.random()<(diff>=3?0.9:0.5)*Math.max(.4,W0.savvy)){ tx.shortNoticed=1; S.rep-=1; tx.msg=`${W0.p}数了数零钱：“还少找我${diff}分。”`; tx.msgOk=false; return render(); } }
  const before=snap(); before.cash += sumDen(tx.change);
  // 钱：客人的钱进钱匣，找零已经从钱匣里拿出去了
  for (const d in tx.pay) S.till[d]=(S.till[d]||0)+tx.pay[d];
  S.stock.candy-=tx.candy;
  for (const g in tx.give) S.stock[g]-=tx.give[g];
  const got = sumDen(tx.pay)-sumDen(tx.change)-tx.candy;
  S.stats.rev += got; S.stats.served++;
  const notes=[]; const L=listTotal(), Q=quote();
  if (Q>L){ S.rep-=1; notes.push('多收了几分钱，'+W0.p+'嘟囔着走了。'); }
  if (Q<L-1){ S.rep+=1; notes.push(W0.p+'说你这人实在。'); }
  for (const r of tx.req){ if (!isBulk(r.g)) continue; const dlt=giveOf(r.g)-r.amt;
    if (dlt>=8){ S.rep+=1; notes.push(`${GOODS[r.g].n}给得足，${W0.p}挺满意。`); } else if (dlt<=-4){ S.flags.shorted=(S.flags.shorted||0)+1; notes.push(`${GOODS[r.g].n}少给了${amtText(r.g,-dlt)}，${W0.p}没看出来。`); } }
  if (given<due){ S.flags.shortChange=(S.flags.shortChange||0)+1; notes.push(`少找了${due-given}分，${W0.p}没发现。`); }
  if (given>due){ const extra=given-due; if (Math.random()<0.35){ gain(extra); S.rep+=1; notes.push(`你多找了${extra}分，${W0.p}又塞了回来：“小同志，算错了。”`); } else notes.push(`你多找了${extra}分。`); }
  if (tx.candy) notes.push(`拿${tx.candy}颗水果糖抵了零钱。`);
  if (w.ticket && tx.ticketState==='ok'){ if (w.tk) S.tickets.bad.push(w.tk); else S.tickets.good++; }
  if (S.diluted===S.day && tx.req.some(r=>r.g==='soy') && Math.random()<0.5){ S.rep-=2; notes.push('“你这酱油怎么这么淡？”'); }
  S.res={text: (notes.length?notes.join(''):pick(['“下回还来。”','钱货两清。','“你这儿比镇东头近多了。”'])), chips:diff(before)};
  tx.step='done'; Scene.react(before,'walk'); render();
}
function refuseDeal(){
  const tx=S.tx, W0=walkerInfo(); if (!tx||tx.step==='done') return;
  const missing = tx.req.some(r=>S.stock[r.g]<r.amt);
  S.rep-=1; if (missing) S.stats.missed++;
  walkAway(missing ? `货不够，${W0.p}摇摇头，往镇东头的供销社去了。` : `“不卖？”${W0.p}莫名其妙地走了。`);
}

// ===================== 剧情选择 =====================
function storyOf(item){ return item.k==='story' ? STORY[item.id] : null; }
function choicesFor(src){
  const list = src.choices().filter(c=>!c.hide||!c.hide());
  if (!list.some(c=>!c.req||c.req()===true)) list.push({label:'实在没办法，只能道个歉', fx:()=>'对方点点头，走了。'});
  return list;
}
function chooseStory(i){
  const item=curItem(), src=STORY[item.id]; const c=choicesFor(src)[i]; if (!c) return;
  if (c.req && c.req()!==true) return;
  const before=snap(); if (src.who) meet(src.who); if (src.reveal) S.flags.zhaoRevealed=1;
  const text=c.fx(); S.rep=Math.max(0,Math.min(100,S.rep)); S.stats.served++;
  S.res={text, chips:diff(before)}; Scene.react(before,'story'); render();
}
function chooseNight(i){
  const src=NIGHTS[S.visitor]; const c=choicesFor(src)[i]; if (!c) return;
  if (c.req && c.req()!==true) return;
  const before=snap(); if (src.who) meet(src.who);
  const text=c.fx(); S.rep=Math.max(0,Math.min(100,S.rep));
  S.night.res={text, chips:diff(before)}; Scene.react(before,'night'); render();
}

function snap(){ return {cash:cash(), rep:S.rep, rel:{...S.rel}, debts:sum(S.debts), owe:sum(S.owe), stock:{...S.stock}, fake:S.fake}; }
function diff(b){
  const chips=[];
  const dc=cash()-b.cash; if (dc) chips.push({t:(dc>0?'+':'')+fmt(dc), c:dc>0?'up':'down'});
  const dr=S.rep-b.rep; if (dr) chips.push({t:`口碑 ${dr>0?'+':''}${dr}`, c:dr>0?'up':'down'});
  for (const id of Object.keys(CAST)){ const v=(S.rel[id]||0)-(b.rel[id]||0); if (v) chips.push({t:`${castName(id)} ${v>0?'↑':'↓'}`, c:v>0?'up':'down'}); }
  const dd=sum(S.debts)-b.debts; if (dd>0) chips.push({t:`记账 ${fmt(dd)}`, c:''}); if (dd<0) chips.push({t:`销账 ${fmt(-dd)}`, c:''});
  const dw=sum(S.owe)-b.owe; if (dw>0) chips.push({t:`欠人 ${fmt(dw)}`, c:'down'});
  return chips;
}
function castName(id){ if (id==='zhao') return S.flags.zhaoRevealed?'小赵':'生面孔'; return CAST[id].name; }

// ===================== 一天的流程 =====================
function newStats(){ return {rev:0, spent:0, credit:0, back:0, missed:0, rep0:S.rep, bgRev:0, bgN:0, short:[], melt:0, served:0}; }
function startMorning(){
  S.phase='morning'; S.res=null; S.tx=null; S.visitor=null; S.night=null;
  S.fakeSoldBefore += S.fakeSoldToday; S.fakeSoldToday=0;
  S.stats=newStats();
  // 批发部的三轮车：按昨晚的订货单送货，货到付款
  const items=[]; let cost=0; const cut=[];
  for (const g of ORDER){ const k=S.order[g]||0; let got=0; for (let i=0;i<k;i++){ const pc=packCost(g, S.day); if (cash()>=pc){ spend(pc); cost+=pc; S.stock[g]+=GOODS[g].pack; got++; } } if (got) items.push([g,got]); if (got<k) cut.push(g); }
  S.stats.spent+=cost; S.delivery = (S.day>0) ? {items, cost, cut} : null; S.order={};
}
function openShop(){
  const d=DAYS[S.day];
  let n = 3 + d.crowd + (S.rep>=60) + (S.rep>=75) - (S.rep<40) - (S.rep<25);
  n=Math.max(2,n);
  const q=Array.from({length:n}, ()=>({k:'walk', w:genWalker(d)}));
  const st=d.story.filter(([id])=>!STORY[id].cond || STORY[id].cond());
  if (S.fakeSoldBefore>0 && !S.flags.complained){ st.push(['complaint','mid']); S.flags.complained=1; }
  for (const [id,pos] of st){ const it={k:'story',id};
    if (pos==='first') q.unshift(it); else if (pos==='mid') q.splice(Math.floor(q.length/2),0,it); else if (pos==='late') q.splice(Math.max(0,q.length-1),0,it); else q.push(it); }
  S.queue=q; S.qi=0; S.phase='day'; prepareItem();
}
function prepareItem(){ const it=curItem(); S.res=null; S.tx = it && it.k==='walk' ? makeTx(it.w) : null; }
function whoOf(item){ return item && item.k==='story' ? STORY[item.id].who : null; }
function nextCustomer(){
  const cur=curItem(), nx=S.queue[S.qi+1];
  if (!(whoOf(cur) && whoOf(cur)===whoOf(nx))) Scene.leave();
  S.qi++;
  if (S.qi>=S.queue.length) closeDay(); else prepareItem();
  render();
}
// 打烊时算柜台前没演出来的零散生意：按口碑、天气、玻璃柜和货底
function closeDay(){
  const d=DAYS[S.day], f=0.5+S.rep/100, disp=S.display.filter(Boolean), boost = S.polished===S.day ? 1.5 : 1.25;
  let rev=0, n=0; const short=[];
  for (const g of ORDER){
    const G=GOODS[g];
    const want=Math.round(G.base*(d.mult[g]||1)*f*(disp.includes(g)?boost:1)*(0.85+Math.random()*0.3));
    const got=Math.min(want, S.stock[g]);
    if (got>0){ S.stock[g]-=got; rev+=priceOf(g,got); const avg=G.req.reduce((a,b)=>a+b,0)/G.req.length; n+=Math.max(1,Math.round(got/avg)); }
    if (want-got >= Math.max(isBulk(g)?50:2, G.base*0.25)) short.push(g);
  }
  gain(rev); S.stats.bgRev=rev; S.stats.bgN=n; S.stats.short=short;
  S.rep=Math.max(0, S.rep-Math.min(4,short.length));
  if (S.diluted===S.day) S.rep=Math.max(0,S.rep-1);
  S.stats.melt=S.stock.ice; S.stock.ice=0;
  S.packets=Math.min(S.packets, Math.floor(S.stock.sugar/50));
  S.tx=null; S.res=null; S.phase='close';
}
function startNight(){
  S.phase='night'; S.night={oil:3, did:{}, res:null};
  const id=DAYS[S.day].night; S.visitor = id && (!NIGHTS[id].cond || NIGHTS[id].cond()) ? id : null;
}
function sleep(){
  if (S.visitor && !(S.night && S.night.res)) return;
  if (S.day>=DAYS.length-1){ S.phase='end'; render(); return; }
  S.day++; startMorning(); render();
}
function packCost(g, day){ return (g==='sugar' && DAYS[Math.min(day,DAYS.length-1)].sugarShort) ? 440 : GOODS[g].packCost; }
function orderTotal(){ const nd=Math.min(S.day+1,DAYS.length-1); return ORDER.reduce((s,g)=>s+(S.order[g]||0)*packCost(g,nd),0); }
function nightAct(id){
  const n=S.night; if (!n || n.did[id] || n.oil<1) return;

  const EMO={heart:['01010','11111','11111','01110','00100'], note:['00110','00101','00100','11100','11100'], bang:['00100','00100','00100','00000','00100'], dots:['00000','00000','10101','00000','00000'], anger:['10001','01010','00000','01010','10001'], sweat:['00100','01100','11110','11110','01100']};
  const EMOC={heart:'#e0435a', note:'#2d7a4c', bang:'#d0302a', dots:'#555555', anger:'#d0302a', sweat:'#3a7bd5'};
  function emote(x,y,k){ R(x-1,y-1,9,9,'#1d2420'); R(x,y,7,7,'#fffef8'); R(x+1,y+8,2,2,'#1d2420'); const m=EMO[k]; if (!m) return; for (let r=0;r<5;r++) for (let c=0;c<5;c++) if (m[r][c]==='1') R(x+1+c,y+1+r,1,1,EMOC[k]); }

  const SPOT={soy:[22,66],oil:[96,112],liquor:[42,70],salt:[80,74],sugar:[80,74],peanut:[70,74],match:[96,112],cig:[96,112],soda:[154,70],ice:[176,68],candy:[58,72],soap:[96,112]};
  const ITEMC={soy:'#3a1e10',oil:'#c9b37a',liquor:'#d9d0b0',salt:'#f4f4f4',sugar:'#ffffff',peanut:'#c9905a',match:'#8a6a3a',cig:'#c23b2e',soda:'#e8892f',ice:'#f8f8ff',candy:'#eb5757',soap:'#e8c870'};

  function coins(n,toBox,x){ for (let i=0;i<n;i++){ const c=i%2?'#d4b04c':'#c9c9c9'; toBox?fly(x,70,131,78,c,2,i*70,18):fly(131,78,x,70,c,2,i*70,18); } }
  function floatText(text,x,y,cls){ const el=document.createElement('div'); el.className='float'+(cls?' '+cls:''); el.textContent=text; el.style.left=(x/W*100)+'%'; el.style.top=(y/H*100)+'%'; fxBox.appendChild(el); setTimeout(()=>el.remove(),1200); }
  function lookFor(){
    if (S.phase==='day'){ const it=curItem(); if (!it) return null; if (it.k==='story'){ const s=STORY[it.id]; return s.who?LOOK[s.who]:s.look; } return WALKERS[it.w.wi].look; }
    if (S.phase==='night' && S.visitor && !(S.night&&S.night.res)){ const s=NIGHTS[S.visitor]; return LOOK[s.who]; }
    return null;
  }
  function sync(){
    const look=lookFor();
    const tag = S.phase==='day' ? 'd'+S.day+':'+S.qi : S.phase==='night' ? 'n'+S.day : null;
    if (!look){ if (V.cur){ leave(); } return; }
    if (V.cur && V.cur.tag===tag){ V.cur.talking = S.phase==='day' ? !S.res && !(S.tx&&S.tx.step==='done') : true; return; }
    if (V.cur && V.cur.look===look){ V.cur.tag=tag; return; }
    if (V.cur) leave();
    const atDoor = S.phase==='night';
    const a={look, x: atDoor?32:30, tx: atDoor?32:96, state:'walk', tag, seed:Math.random()*10, talking:true, emote:null, atDoor};
    V.actors.push(a); V.cur=a;
  }
  function react(before, kind){
    const a=V.cur; const x=a?a.x:96; if (a) a.talking=false;
    const dc=cash()-before.cash;
    for (const g of ORDER){ const dq=before.stock[g]-S.stock[g]; if (dq>0 && a){ const [sx,sy]=SPOT[g]; const n=isBulk(g)?2:Math.min(4,dq); for (let i=0;i<n;i++) fly(sx,sy,x+((i%2)?3:-3),66,ITEMC[g],(g==='soda'||g==='ice')?3:2,i*60,22); } }
    if (before.fake>S.fake && a) fly(28,102,x,66,'#c23b2e',3,0,26);
    if (dc>0){ coins(Math.min(6,Math.ceil(dc/15)),true,x); floatText('+'+fmt(dc),140,60); }
    if (dc<0){ coins(Math.min(6,Math.ceil(-dc/40)),false,x); floatText(fmt(dc),140,60,'loss'); }
    if (sum(S.debts)!==before.debts){ V.ledgerFlash=1400; floatText(sum(S.debts)>before.debts?'记账':'销账',112,92,'note'); }
    if (!a) return;
    const up=Object.keys(S.rel).some(k=>(S.rel[k]||0)>(before.rel[k]||0)), down=Object.keys(S.rel).some(k=>(S.rel[k]||0)<(before.rel[k]||0));

    if (kind==='story' && nx && (nx.id==='zhaoReveal'||nx.id==='zhaoStash')) k='bang';

    if (k) a.emote={k, until:V.t+1600};

  function pop(g){ const [sx,sy]=SPOT[g]; fly(sx,sy,96,80,ITEMC[g],2,0,10); }
  function leave(){ if (V.cur){ V.cur.state='leave'; V.cur.tx=-10; V.cur.talking=false; V.cur=null; } }
  let last=performance.now();
  function frame(now){
    const dt=Math.min(64,now-last); last=now; V.t+=dt; const k=sp();
    if (S){
      V.tod += (targetTod()-V.tod)*Math.min(1,dt/900*k);
      V.shutter += (targetShutter()-V.shutter)*Math.min(1,dt/450*k);

      for (const a of V.actors){ const v=0.05*dt*k; if (Math.abs(a.tx-a.x)>0.5){ a.x+=Math.sign(a.tx-a.x)*Math.min(v,Math.abs(a.tx-a.x)); if (a.state!=='leave') a.state='walk'; } else if (a.state==='walk') a.state='idle'; }
      V.actors=V.actors.filter(a=>!(a.state==='leave' && (a.x<=-9 || a.atDoor)));

  }
  function setFast(v){ fast=v; try{ localStorage.setItem('xmb-fast',v?'1':'0'); }catch(e){} document.getElementById('speedBtn').textContent=v?'快进中':'慢放'; }
  setFast(fast); requestAnimationFrame(frame);

function renderCounter(item){

  const slip = `<div class="slip">${tx.req.map(r=>{ const gv=giveOf(r.g); const done=isBulk(r.g)? Math.abs(gv-r.amt)<=3 : gv>=r.amt; const over=isBulk(r.g)&&gv-r.amt>3;
      return `<div class="slip-row ${done?'done':''} ${over?'over':''}">${img(r.g)}<span class="need">要 ${amtText(r.g,r.amt)} ${GOODS[r.g].full}</span><span class="got">${GOODS[r.g].kind==='liquid'?'打了':isBulk(r.g)?'称了':'拿了'} ${amtText(r.g,gv)}${done?' ✓':''}</span></div>`; }).join('')}</div>`;
  let body='';
  if (tx.step==='prep'){
    const ticket = w.ticket ? `<div class="counter-row"><span class="counter-label">糖票</span><button class="ticket" type="button" data-act="inspect">${ticketText(w,true)}</button>
      ${tx.ticketState==='pending'?`<button class="btn small" type="button" data-act="tkOk">收票</button><button class="btn small no" type="button" data-act="tkNo">不收，按议价</button>`:`<span>${tx.ticketState==='ok'?'收了票，按牌价':'没收票，按议价'}</span>`}</div>` : '';
    const given = ORDER.filter(g=>giveOf(g)>0);
    const counterRow = `<div class="counter-row"><span class="counter-label">你递过去</span>${given.length?given.map(g=>`<button class="thing" type="button" data-act="back" data-g="${g}" title="点一下拿回来">${img(g)}${amtText(g,giveOf(g))}</button>`).join(''):'<span style="opacity:.8">点右边货架上的格子拿货</span>'}</div>`;
    const tool = tx.tool ? toolPanel(tx.tool) : '';
    const L=listTotal(), Q=quote();
    const abacus = `<div class="abacus"><span class="list">牌价合计 ${fmt(L)}${w.items.some(i=>i.g==='sugar')?`（白糖${tx.ticketState==='ok'?'凭票':'议价'} ${fmt(txUnitPrice('sugar'))}/斤）`:''}</span><span class="sum">报价 ${fmt(Q)}</span>
      <button class="btn" type="button" data-act="adj" data-v="-10">−1角</button><button class="btn" type="button" data-act="adj" data-v="-1">−1分</button><button class="btn" type="button" data-act="adj" data-v="1">+1分</button><button class="btn" type="button" data-act="adj" data-v="10">+1角</button></div>`;
    body = `<div class="counter">${ticket}${counterRow}</div>${tool}${abacus}
      <div class="row-btns"><button class="btn go" type="button" data-act="collect">收钱 <kbd>空格</kbd></button><button class="btn no" type="button" data-act="refuse">不卖</button></div>`;
  } else if (tx.step==='change'){
    const due=changeDue(), given=changeGiven(), left=due-given;
    const payRow = `<div class="counter-row"><span class="counter-label">客人给了</span>${DEN.filter(d=>tx.pay[d]).map(d=>`<span class="thing"><img src="${MONEY_URL[d]}" alt="">${DEN_NAME[d]}×${tx.pay[d]}</span>`).join('')}<b>${fmt(sumDen(tx.pay))}</b></div>`;
    const chRow = `<div class="counter-row"><span class="counter-label">你找的</span>${DEN.filter(d=>tx.change[d]).map(d=>`<button class="thing" type="button" data-act="unchange" data-d="${d}"><img src="${MONEY_URL[d]}" alt="">${DEN_NAME[d]}×${tx.change[d]}</button>`).join('')}${tx.candy?`<span class="thing">${img('candy')}糖×${tx.candy}</span>`:''}${!given?'<span style="opacity:.8">点右边钱匣里的钱找零</span>':''}</div>`;
    body = `<div class="counter">${payRow}${chRow}</div>
      <div class="abacus"><span class="list">报价 ${fmt(quote())}，收 ${fmt(sumDen(tx.pay))}</span><span class="sum">应找 ${fmt(due)}</span><span>${left>0?`还差 ${fmt(left)}`:left<0?`多找了 ${fmt(-left)}`:'正好'}</span></div>
      <div class="row-btns"><button class="btn go" type="button" data-act="finish">找好了 <kbd>空格</kbd></button><button class="btn" type="button" data-act="auto">帮我凑 <kbd>Z</kbd></button>${left>0&&left<=4&&S.stock.candy>=left?`<button class="btn" type="button" data-act="candy">拿${left}颗糖抵</button>`:''}</div>`;
  }
  const msg = tx.msg ? `<p class="msg ${tx.msgOk?'ok':''}">${tx.msg}</p>` : '';
  return `<article class="paper">${head}${slip}${msg}${body}</article>`;
}
function toolPanel(g){

  return `<div class="tool"><div class="gauge-txt"><b>${G.kind==='liquid'?'提子 · 往客人瓶里打':'台秤'} · ${G.full}</b><span>${amtText(g,gv)} / 要 ${amtText(g,rq)}</span></div>

}

function stockValue(){ return ORDER.reduce((s,g)=>s+Math.round(S.stock[g]*GOODS[g].packCost/GOODS[g].pack),0); }
function diary(){
  const f=S.flags, s=S.stats;
  const tail = s.melt>5 ? `冰棍化了${s.melt}根，箱子里一摊糖水。` : s.short.length ? `${GOODS[s.short[0]].n}断了货，今晚得多订点。` : '';
  switch(S.day){
    case 0: return (f.junDebt?'账本第一页，记下了第一个名字：李军，两分。':f.junGift?'送出去两颗糖。账本还是空的。':'第一天。账本还是空的。')+tail;
    case 1: return (f.boughtFake?'柜台底下多了个麻袋。':(f.fangHelped||f.fangCheap)?'阿芳的粮票压在钱匣子底下。':'天太热，冰棍箱子见了底。')+tail;
    case 2: return (f.wangCredit?'王婶家的账记上了。礼拜五见。':f.wangRefused?'下午看见王婶往镇东头去，你低头理了理货架。':'糖厂停了，问白糖的人比平时多。')+tail;
    case 3: return (f.snitched||f.covered||f.stashSnitch||f.stashCover||f.stashLost?'工商所的人走了。柜台底下空了。':f.zhaoMet?'那个穿白衬衫的年轻人，后来在供销社门口站了很久。':'下午一场雷阵雨，街上的土味一下子冲了出来。')+tail;
    case 4: return '晒谷场的电影开场了，喇叭声隔着几条街都听得见。';
  }
  return '';
}
function echoes(){
  const f=S.flags, out=[];
  if (f.junHonest) out.push('<b>小军</b>还上了那两分钱。九年后，他会站在同一个柜台前，跟你借一笔大得多的钱。');
  else if (f.junForgiven) out.push('<b>小军</b>的两分钱，你没要。他记得这件事，比你记得久。');
  else if (f.junDrawing) out.push('<b>小军</b>画的那张门市，一直贴在价目表旁边。');
  else if (S.debts.jun) out.push('<b>小军</b>还欠你两分钱。账本会一直带着走。');
  else if (f.junNo) out.push('<b>小军</b>后来很少来你这儿买糖。');
  if (f.wangPaid) out.push('<b>王婶</b>家的账，这次还清了。下一回，老李的厂子不一定还发得出工资。');
  else if (f.wangRefused) out.push('<b>王婶</b>后来打酱油，还是走去镇东头。');
  if (f.laoliMet) out.push((S.rel.laoli||0)>=2?'<b>老李</b>那晚在你这儿坐了半个钟头。他说的车间承包，要过很多年才见分晓。':'<b>老李</b>说厂里要搞承包。他担心的事，要过很多年才见分晓。');
  if (f.borrowWang) out.push(`你欠<b>王婶</b>${yuan(S.owe.wang||0)}。她说啥时候有啥时候还。`);
  if (f.fangLent) out.push('<b>阿芳</b>天亮前走了。账本上那一行“林芳，借六元”，你不知道要等多久。');
  else if (f.fangHelped) out.push('<b>阿芳</b>天亮前走了。她说会寄明信片来。');
  else if (f.fangCheap) out.push('<b>阿芳</b>天亮前走了。');
  if (S.grain>0) out.push(`你手里还有 ${S.grain} 斤全国粮票。`);
  if (f.stashSnitch) out.push('<b>刘哥</b>寄存的电子表被没收了。他知道是你说出去的。');
  else if (f.stashCover) out.push('你替<b>刘哥</b>认下了那一麻袋电子表，罚了五块。他欠你一个大人情。');
  else if (f.stash) out.push('<b>刘哥</b>的麻袋还在柜台底下，礼拜六他会来取。里面哗啦哗啦响。');
  else if (f.snitched) out.push('<b>刘哥</b>被罚了款，在镇上放话说你不地道。');
  else if (f.covered) out.push('<b>刘哥</b>听说你替他扛了，托人捎来一句话：“兄弟，我记下了。”');
  else if (f.boughtFake) out.push('<b>刘哥</b>的麻袋还会再来。');
  else if (f.spottedFake) out.push('你一眼看出了<b>刘哥</b>的冒牌烟。他说你眼尖，以后有真东西再来找你。');
  if (f.borrowLiu) out.push(`你欠<b>刘哥</b>${yuan(S.owe.liu||0)}，下礼拜要还。`);
  if (f.zhouKept) out.push('<b>周老师</b>逢人就说，镇口那家门市靠得住。');
  else if (f.zhouBroken) out.push('<b>周老师</b>再没来你这儿买过火柴。');
  else if (f.zhouHurt||f.zhouLate) out.push('<b>周老师</b>还会来，但会多看你一眼。');
  if (S.tickets.bad.length) out.push(`你收了 ${S.tickets.bad.length} 张不对的糖票，<b>陈主任</b>都挑出来了。`);
  if (f.shortChange||f.shorted) out.push('有几回少找了钱、少给了分量，客人没发现。你自己知道。');
  if (f.rentLate) out.push('你欠着供销社的承包费。<b>陈主任</b>的本子上，记了你一笔。');
  if (f.denied) out.push('下棋的老头们都知道了，镇口门市的烟不对劲。');
  if (!out.length) out.push('这个夏天很平静。账本上干干净净，也没有谁特别记得你。');
  return out;
}

    <section><h3>我欠别人的</h3>${lines(Object.entries(S.owe))}</section>
    <section><h3>人情</h3>${met.length?`<ul class="lines">${met.map(id=>`<li><span>${id==='zhao'&&!S.flags.zhaoRevealed?'穿白衬衫的年轻人':CAST[id].book}</span><span class="meta">${relWord(S.rel[id]||0)}</span></li>`).join('')}</ul>`:'<p class="empty">还没跟谁打过交道</p>'}</section>
    <section><h3>这礼拜收的糖票</h3><p class="empty">${S.tickets.good+S.tickets.bad.length} 张</p></section>
    <section><h3>柜台底下</h3><ul class="lines">${S.fake?`<li><span>刘哥的大前门</span><span>${S.fake} 包</span></li>`:''}${S.flags.stash?'<li><span>刘哥寄存的麻袋</span><span>1 个</span></li>':''}${S.grain?`<li><span>全国粮票</span><span>${S.grain} 斤</span></li>`:''}${S.packets?`<li><span>分装好的白糖</span><span>${S.packets} 包</span></li>`:''}</ul>${!S.fake&&!S.flags.stash&&!S.grain&&!S.packets?'<p class="empty">空的</p>':''}</section>`;
}

// ===================== 输入 =====================
function act(a, el){
  const ds = el ? el.dataset : {};
  switch(a){
    case 'begin': S.day=0; startMorning(); break;
    case 'open': openShop(); break;
    case 'take': tapGood(ds.g); return;
    case 'back': takeBack(ds.g); return;
    case 'measure': measure(ds.g, ds.h); return;
    case 'adj': setAdj(+ds.v); return;
    case 'tkOk': ticketDecide(true); return;
    case 'tkNo': ticketDecide(false); return;
    case 'inspect': showTicket(); return;
    case 'closeModal': $('modal').hidden=true; return;
    case 'collect': collectPay(); return;
    case 'refuse': refuseDeal(); return;
    case 'change': addChange(+ds.d); return;
    case 'unchange': removeChange(+ds.d); return;
    case 'auto': autoChange(); return;
    case 'candy': candyChange(); return;
    case 'finish': finishDeal(); return;
    case 'pick': chooseStory(+ds.i); return;
    case 'npick': chooseNight(+ds.i); return;
    case 'next': if (S.phase==='day') nextCustomer(); return;
    case 'toNight': startNight(); break;
    case 'nact': nightAct(ds.id); return;
    case 'oinc': S.order[ds.g]=(S.order[ds.g]||0)+1; break;
    case 'odec': S.order[ds.g]=Math.max(0,(S.order[ds.g]||0)-1); break;
    case 'slot': S.dispSel = S.dispSel===+ds.i ? (S.display[+ds.i]=null, null) : +ds.i; break;
    case 'putDisp': if (S.dispSel!=null){ const g=ds.g; S.display=S.display.map(x=>x===g?null:x); S.display[S.dispSel]=g; S.dispSel=null; } break;
    case 'sleep': sleep(); return;
    case 'again': S=fresh(); break;
    case 'closeLedger': toggleLedger(false); return;
  }
  render();
}
document.addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if (!b||b.disabled) return; act(b.dataset.act, b); });
$('ledgerBtn').addEventListener('click', ()=>toggleLedger(true));
$('speedBtn').addEventListener('click', ()=>Scene.setFast(!Scene.fast));
$('sheet').addEventListener('click', e=>{ if (e.target.id==='sheet') toggleLedger(false); });
$('modal').addEventListener('click', e=>{ if (e.target.id==='modal') $('modal').hidden=true; });
function toggleLedger(open){ if (open){ renderLedger(); $('sheet').hidden=false; $('sheetPanel').querySelector('button').focus(); } else { $('sheet').hidden=true; $('ledgerBtn').focus(); } }
document.addEventListener('keydown', e=>{
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if (k==='Escape'){ if (!$('modal').hidden){ $('modal').hidden=true; return; } if (!$('sheet').hidden){ toggleLedger(false); return; } }
  if (k==='l'||k==='L'){ toggleLedger($('sheet').hidden); return; }
  if (k==='f'||k==='F'){ Scene.setFast(!Scene.fast); return; }
  if (!$('sheet').hidden || !$('modal').hidden) return;
  if (k==='z'||k==='Z'){ autoChange(); return; }
  if (/^[1-9]$/.test(k)){ const b=document.querySelector(`[data-act=pick][data-i="${+k-1}"],[data-act=npick][data-i="${+k-1}"]`); if (b && !b.disabled){ e.preventDefault(); b.click(); } return; }
  if (k===' '||k==='Enter'){
    if (document.activeElement && document.activeElement.tagName==='BUTTON') return;
    const sel = S.phase==='day' ? (S.res?'[data-act=next]': S.tx&&S.tx.step==='prep'?'[data-act=collect]': S.tx&&S.tx.step==='change'?'[data-act=finish]':null)
      : ({title:'[data-act=begin]', morning:'[data-act=open]', close:'[data-act=toNight]', night:'[data-act=sleep]', end:'[data-act=again]'})[S.phase];
    const b=sel&&document.querySelector(sel); if (b && !b.disabled){ e.preventDefault(); b.click(); }
  }
});

// ===================== 测试用：自动玩 =====================
window.__shop = {
  get S(){ return S; },
  // honest=true：照牌价、称足、找对；否则随机乱来
  step(honest=true){
    const p=S.phase;
    if (p==='title') return act('begin');
    if (p==='morning') return act('open');
    if (p==='close') return act('toNight');
    if (p==='end') return;
    if (p==='night'){
      if (S.visitor && !S.night.res){ const l=choicesFor(NIGHTS[S.visitor]); const ok=l.map((c,i)=>[c,i]).filter(([c])=>!c.req||c.req()===true); return chooseNight(pick(ok)[1]); }
      if (S.day<DAYS.length-1 && !S.night.ordered){ S.night.ordered=1; const nd=S.day+1; for (const g of ORDER){ const G=GOODS[g]; const need=G.base*((DAYS[nd].mult[g]||1))*1.1+ (isBulk(g)?G.req[G.req.length-1]*3:G.req[G.req.length-1]*3); let k=0; while (S.stock[g]+k*G.pack<need && k<9 && orderTotal()+packCost(g,nd)<=cash()-900){ k++; S.order[g]=k; } } }
      return sleep();
    }
    if (p==='day'){
      if (S.res || (S.tx&&S.tx.step==='done')) return nextCustomer();
      const it=curItem();
      if (it.k==='story'){ const l=choicesFor(STORY[it.id]); const ok=l.map((c,i)=>[c,i]).filter(([c])=>!c.req||c.req()===true); return chooseStory(pick(ok)[1]); }
      const tx=S.tx;
      if (tx.step==='prep'){
        if (tx.ticketState==='pending') return ticketDecide(honest ? !curWalker().tk : Math.random()<0.7);
        for (const r of tx.req){ if (S.stock[r.g] < r.amt) return refuseDeal(); }
        if (honest){ for (const r of tx.req) tx.give[r.g]=r.amt; }
        else { for (const r of tx.req) tx.give[r.g]= isBulk(r.g) ? Math.max(1,Math.min(S.stock[r.g], r.amt+rnd(-15,15))) : r.amt; if (Math.random()<0.3) tx.adj=rnd(1,15); }
        return collectPay();
      }
      if (tx.step==='change'){ if (!changeGiven()) autoChange(); if (!changeGiven() && changeDue()>0){ const left=changeDue(); if (left<=4 && S.stock.candy>=left) candyChange(); } return finishDeal(); }
    }
  },
  run(honest=true, max=3000){ let n=0; while (S.phase!=='end' && n<max){ this.step(honest); n++; } return {steps:n, phase:S.phase, cash:cash(), rep:S.rep, flags:Object.keys(S.flags)}; },
};

function boot(data){ S = data && data.S ? data.S : fresh(); render(); }
window.claude?.hot?.snapshot?.(() => ({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
